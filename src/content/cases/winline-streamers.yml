sections:
  - label: ЗАДАЧА
    text: Рассказать зрителям о бонусе Winline «3000 рублей при регистрации».
      Реклама должна смотреться частью контента, а оффер, промокод и QR-код
      зритель должен успеть заметить и запомнить.
    media: []
  - label: МОЯ РОЛЬ
    text: "Придумала сценарий рекламного оверлея, баннера и собрала раскадровку: для
      каждого кадра расписала ракурс, движение камеры и момент, когда появляется
      каждый элемент для передачи моушен дизайнеру. Сделала вертикальные баннеры
      для трансляций."
  - label: ПРИМЕНЕНИЕ
    text: Ролик и баннеры сделаны для прямых трансляций. В ролике оффер раскрывается
      по шагам. Так зритель успевает прочитать каждый элемент, а реклама
      выглядит частью контента.
