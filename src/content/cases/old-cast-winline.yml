sections:
  - label: ЗАДАЧА
    text: "Оформить упаковку для линейки замороженной рыбы: треска филе лоин, филе
      блочное и фарш трески. Линейка должна выглядеть единой, но каждый продукт
      нужно легко отличить от других. Ещё одна важная часть задачи — подготовить
      макеты к печати на гибкой упаковке."
  - label: РЕЗУЛЬТАТ
    text: "Упаковка вышла в печать и уже продаётся в магазинах. Линейка выглядит
      цельно и хорошо читается на полке: покупатель сразу видит продукт, вес и
      быстро узнает бренд."
