sections:
  - label: ЗАДАЧА
    text: "На основе готового Key Visual нужно было оформить все экраны турнирной
      сцены: главный экран, боковые экраны с игроками и LED-панели на столах
      команд. Mobile Legends — мобильная игра со своими этапами матча: фаза
      банов, пиков, сама игра. Для каждого этапа нужна была своя графика,
      которая хорошо читается из зала."
    width: ""
  - label: РЕЗУЛЬТАТ
    text: >-
      Графика работала на сцене весь турнир, включая гранд-финал, и попала

      в трансляцию. Сцена выглядела цельно: прослеживался KV турнира, а зрители в зале легко следили за ходом матча и составами команд.
