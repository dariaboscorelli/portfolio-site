hero: /images/uploads/fpg-hero.webp
sections:
  - label: ЗАДАЧА
    width: 864
    text: >
      Оформить все экраны турнирной сцены: главный экран, боковые экраны

      и LED-панели на столах игроков. Графика должна была сделана в стиле турнира, хорошо читаться из зала. Счёт, составы и статистика игроков меняются по ходу матча, поэтому макеты нужно было собрать так, чтобы

      их было легко запрограммировать и анимировать.
  - label: МОЯ РОЛЬ
    width: 891
    text: Отвечала за всю статичную графику для экранов. Для каждого экрана делала
      раскадровку и передавала её моушен-дизайнеру, который анимировал графику
      по моим макетам, а также собирала экраны для всевозможных сценариев,
      которые нужно было заготовить заранее для технического специалиста.
  - label: РЕЗУЛЬТАТ
    width: 739
    text: "Графика вышла на экраны арены во время турнира: она была яркой,
      эффектной, а главное - функциональной: можно было отслеживать всю важную
      статистику во время игры в едином стиле Fissure Playground."
