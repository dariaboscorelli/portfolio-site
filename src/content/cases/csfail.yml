  - label: ЗАДАЧА
    text: Обновить визуальный стиль соцсетей CSFAIL. Посты должны стать ярче и
      заметнее в ленте, а сам стиль должен позволять быстро выпускать анонсы,
      ивенты и акции.
  - label: РЕЗУЛЬТАТ
    text: "Посты сделаны под каждое событие: обновления платформы, киберспортивные
      турниры и чемпионат мира по футболу. Стиль легко подстраивается под тему,
      от киберспорта до футбола, а посты остаются узнаваемыми: тот же логотип,
      та же типографика и одинаковая подача оффера."
