      Wallachia Season 3. Шаблоны легко обновлять под каждый матч: меняются
      соперник, время, формат и счёт. Тёмно-зелёный с красным и монохромные
      3D-образы героев Dota 2 делают посты команды узнаваемыми в ленте."
