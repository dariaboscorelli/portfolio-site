sections:
  - label: ЗАДАЧА
    text: Оформить студию Old Cast для новогодних трансляций по Dota 2 в стиле
      советской квартиры. Спонсор Winline должен быть частью интерьера, а не
      отдельной рекламой.
  - label: РЕЗУЛЬТАТ
    text: "По 3D-макету собрали настоящую студию, и в кадре она совпадает с
      визуализацией. Печать живёт прямо в интерьере: газета лежит на столе,
      шампанское «Куала-Лумпурского шампанского завода Old Cast» стоит рядом,
      карточки разложены на игровом столе. Winline встроен в обстановку: его
      логотип появляется на экране старого телевизора, на газете и на этикетке."
